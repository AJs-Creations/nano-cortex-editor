# Pull-request checks.
#  - smoke (required): npm ci, regenerate the protocol layer from the vendored editor (fails loudly if
#    upstream moved anything), and syntax-check every script.
#  - ux-test (informational): the full input-driven UX test on demo data. It drives a real Electron window
#    with mouse, wheel and key events; on GitHub's macOS runners (small 1024×768 display, slow VMs) a few
#    timing-sensitive checks (write coalescing, stopping the slot scan, delayed parameter refreshes) fail
#    intermittently, so it does not block the PR. Run `npm run test:ux` locally before merging; it must be
#    fully green there. Screenshots and results are attached to every run.
name: CI

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - name: Syntax check
        run: for f in src/*.js pro/*.js scripts/*.js test/*.js; do node --check "$f"; done

  ux-test:
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: UX test (demo data)
        run: npm run test:ux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-test-output
          path: test-output/
